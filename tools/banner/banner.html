<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Termic+ banner</title>
<!--
  Source of docs/banner-light.png and docs/banner-dark.png. Colors are the
  app's --color-bg, --color-fg, --color-fg-dim, --color-accent and
  --color-bg-3 from src/index.css, light and dark. The wordmark cells are
  copied from docs/termic-wordmark.svg. The .mark font-size is the drawn
  wordmark height, so the phone legibility check measures what is seen.
  Rerender with tools/banner/regenerate.sh (macOS only).
-->
<style>
:root {
  --banner-bg: #faf9f6;
  --banner-ink: #1c1b1a;
  --banner-muted: #55534f;
  --banner-accent: #c25e3d;
  --banner-rule: #ddd9d0;
}

@media (prefers-color-scheme: dark) {
  :root {
    --banner-bg: #0c0c0c;
    --banner-ink: #e8e6e2;
    --banner-muted: #a8a6a2;
    --banner-accent: #d97757;
    --banner-rule: #282828;
  }
}

html, body {
  margin: 0;
  background: transparent;
}

.banner {
  position: relative;
  width: 900px;
  height: 300px;
  box-sizing: border-box;
  overflow: hidden;
  background: var(--banner-bg);
  border-bottom: 2px solid var(--banner-rule);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 26px;
  font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
}

.mark {
  font-size: 98px;
  display: flex;
  align-items: flex-start;
  gap: 6px;
}

.wordmark rect {
  fill: var(--banner-ink);
}

.plus rect {
  fill: var(--banner-accent);
}

.tagline {
  margin: 0;
  font-size: 36px;
  line-height: 1.2;
  text-align: center;
  color: var(--banner-muted);
  letter-spacing: 0.01em;
}
</style>
</head>
